<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            background: #ffffff;
        }
        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        #game_screen {
            display: block;
            width: min(100vw, 177.81vh);
            width: min(100dvw, 177.81dvh);
            height: min(100vh, 56.24vw);
            height: min(100dvh, 56.24dvw);
            touch-action: none;
        }
        #temp_canvas {
            display: none;
        }
        #adventure-compute-modal {
            box-sizing: border-box;
            padding: 16px;
        }
        #adventure-compute-modal *,
        #adventure-usage-root * {
            box-sizing: border-box;
        }
        @media (max-width: 640px) {
            #compute-engine-options,
            #fq1-engine-options {
                grid-template-columns: 1fr !important;
            }
        }
        #adventure-loading {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
                #111318;
            background-size: 28px 28px, 28px 28px, auto;
            color: #f7f3ea;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        #adventure-loading-card {
            width: min(440px, calc(100vw - 40px));
            padding: 24px;
            border: 1px solid rgba(247, 243, 234, 0.16);
            border-radius: 8px;
            background: rgba(22, 24, 29, 0.92);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.36);
            box-sizing: border-box;
        }
        #adventure-loading-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 10px;
        }
        #adventure-loading-title strong {
            font-size: 18px;
            letter-spacing: 0;
        }
        #adventure-loading-percent {
            min-width: 44px;
            text-align: right;
            color: #f0b35a;
            font-variant-numeric: tabular-nums;
            font-weight: 800;
        }
        #adventure-loading-status {
            margin-bottom: 16px;
            color: #c9c2b4;
            font-size: 13px;
            line-height: 1.55;
        }
        #adventure-loading-track {
            height: 10px;
            overflow: hidden;
            border-radius: 999px;
            background: #2a2d35;
            border: 1px solid rgba(247, 243, 234, 0.1);
        }
        #adventure-loading-fill {
            width: 8%;
            height: 100%;
            border-radius: inherit;
            background: #37c6a3;
            transition: width 240ms ease;
        }
        #adventure-loading-detail {
            margin-top: 12px;
            color: #9ea7a3;
            font-size: 12px;
            min-height: 18px;
        }
        #adventure-loading-steps {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 18px;
        }
        .adventure-loading-step {
            height: 3px;
            border-radius: 999px;
            background: #343842;
        }
        .adventure-loading-step.is-active {
            background: #37c6a3;
        }
    </style>
    <title>Adventure</title>
</head>
<body>
    <div id="adventure-loading">
        <div id="adventure-loading-card">
            <div id="adventure-loading-title">
                <strong>Adventure 준비 중</strong>
                <span id="adventure-loading-percent">0%</span>
            </div>
            <div id="adventure-loading-status">보드 이미지와 계산 엔진을 준비하고 있습니다.</div>
            <div id="adventure-loading-track" aria-hidden="true">
                <div id="adventure-loading-fill"></div>
            </div>
            <div id="adventure-loading-detail">초기화 시작</div>
            <div id="adventure-loading-steps" aria-hidden="true">
                <span class="adventure-loading-step is-active"></span>
                <span class="adventure-loading-step"></span>
                <span class="adventure-loading-step"></span>
            </div>
        </div>
    </div>
    <canvas id="temp_canvas" width="1234" height="694"></canvas>
    <canvas id="game_screen" width="1234" height="694"></canvas>
    <script src="./js/stageName.js?v=20260509051442377682"></script>
    <script src="./js/stage.js?v=20260509051442377682"></script>
    <script src="./js/cardInfo.js?v=20260509051442377682"></script>
    <script src="./js/userCardInfo.js?v=20260509051442377682"></script>
    <script src="./js/board.js?v=20260807203200000000"></script>
    <script src="./js/gpu_engine.js?v=20260808092500000000"></script>
    <script src="./js/cpu_rollout_worker_loader.js?v=20260807203200000000"></script>
    <script src="./js/adventure.js?v=20260509051442377682"></script>
    <script src="./js/fq1_mode.js?v=20260806083700000000"></script>
    <script>
        (() => {
            function isMobileGpuUiEnvironment() {
                const coarsePointer = typeof window.matchMedia === 'function' && window.matchMedia('(pointer: coarse)').matches;
                const touch = (navigator.maxTouchPoints || 0) > 0;
                const viewportMin = Math.min(
                    window.innerWidth || document.documentElement.clientWidth || 9999,
                    window.innerHeight || document.documentElement.clientHeight || 9999
                );
                return (coarsePointer || touch) && viewportMin <= 900;
            }

            const originalCreateGpuDispatchTuner = window.createGpuDispatchTuner;
            if (typeof originalCreateGpuDispatchTuner === 'function') {
                window.createGpuDispatchTuner = function (batchIteration, settings = {}) {
                    if (!isMobileGpuUiEnvironment()) {
                        return originalCreateGpuDispatchTuner(batchIteration, settings);
                    }

                    const load = settings.gpuLoad || 'medium';
                    const profile = load === 'low'
                        ? { targetChunkMs: 50, yieldMs: 24, cooldownRatio: 0.35, initialChunkPct: 2, minChunkPct: 0.75 }
                        : load === 'high'
                            ? { targetChunkMs: 120, yieldMs: 8, cooldownRatio: 0.08, initialChunkPct: 5, minChunkPct: 1.5 }
                            : { targetChunkMs: 75, yieldMs: 16, cooldownRatio: 0.18, initialChunkPct: 3, minChunkPct: 1 };
                    const currentTarget = Number(settings.targetChunkMs);
                    const currentInitial = Number(settings.initialChunkPct);
                    const currentMin = Number(settings.minChunkPct);

                    return originalCreateGpuDispatchTuner(batchIteration, {
                        ...settings,
                        targetChunkMs: Number.isFinite(currentTarget) && currentTarget > 0
                            ? Math.min(currentTarget, profile.targetChunkMs)
                            : profile.targetChunkMs,
                        yieldMs: Math.max(Number(settings.yieldMs) || 0, profile.yieldMs),
                        cooldownRatio: Math.max(Number(settings.cooldownRatio) || 0, profile.cooldownRatio),
                        initialChunkPct: Number.isFinite(currentInitial) && currentInitial > 0
                            ? Math.min(currentInitial, profile.initialChunkPct)
                            : profile.initialChunkPct,
                        minChunkPct: Number.isFinite(currentMin) && currentMin > 0
                            ? Math.min(currentMin, profile.minChunkPct)
                            : profile.minChunkPct
                    });
                };
            }

            const originalWaitGpuYield = window.waitGpuYield;
            if (typeof originalWaitGpuYield === 'function') {
                window.waitGpuYield = function (ms) {
                    const delay = Math.max(0, Number(ms) || 0);
                    if (!isMobileGpuUiEnvironment() || document.hidden || delay <= 0 || typeof window.requestAnimationFrame !== 'function') {
                        return originalWaitGpuYield(delay);
                    }
                    return new Promise(resolve => {
                        window.requestAnimationFrame(() => window.setTimeout(resolve, delay));
                    });
                };
            }

            const originalShowComputeModeModal = window.showComputeModeModal;
            if (typeof originalShowComputeModeModal !== 'function') return;

            function addManualPerfButton() {
                const modal = document.getElementById('adventure-compute-modal');
                if (!modal || modal.querySelector('#compute-measure-perf')) return;
                const startButton = modal.querySelector('#compute-start');
                if (!startButton || !startButton.parentNode) return;

                const measureButton = document.createElement('button');
                measureButton.id = 'compute-measure-perf';
                measureButton.type = 'button';
                measureButton.textContent = '추론 시간 측정';
                measureButton.style.border = '1px solid #2563eb';
                measureButton.style.borderRadius = '6px';
                measureButton.style.padding = '9px 14px';
                measureButton.style.background = '#ffffff';
                measureButton.style.color = '#2563eb';
                measureButton.style.fontWeight = '700';
                measureButton.style.cursor = 'pointer';
                startButton.parentNode.insertBefore(measureButton, startButton);

                measureButton.addEventListener('click', () => {
                    if (computePerfBenchmarkRunning || computePerfBenchmarkPromise) return;
                    const cpuWorkerCandidates = [1, Math.ceil(maxWorkerCount / 2), maxWorkerCount]
                        .filter((value, index, values) => value >= 1 && values.indexOf(value) === index);
                    measureButton.disabled = true;
                    measureButton.style.opacity = '0.7';
                    measureButton.style.cursor = 'default';
                    measureButton.textContent = '측정 중...';

                    computePerfBenchmarkPromise = measureComputePerfOptions(isGpuAvailable(), cpuWorkerCandidates)
                        .catch(error => console.warn('Compute perf benchmark failed.', error))
                        .finally(() => {
                            computePerfBenchmarkPromise = null;
                            if (!modal.isConnected) return;
                            measureButton.disabled = false;
                            measureButton.style.opacity = '1';
                            measureButton.style.cursor = 'pointer';
                            measureButton.textContent = '다시 측정';
                            if (typeof scheduleComputeModeModalFit === 'function') scheduleComputeModeModalFit();
                        });
                });
            }

            window.showComputeModeModal = function (onDone) {
                const before = new URL(window.location.href);
                const hadSkip = before.searchParams.has('skipPerfBenchmark');
                const oldSkip = before.searchParams.get('skipPerfBenchmark');
                const suppressed = new URL(before.href);
                suppressed.searchParams.set('skipPerfBenchmark', '1');
                window.history.replaceState(window.history.state, '', suppressed.href);
                try {
                    return originalShowComputeModeModal(onDone);
                } finally {
                    const restored = new URL(window.location.href);
                    if (hadSkip) restored.searchParams.set('skipPerfBenchmark', oldSkip);
                    else restored.searchParams.delete('skipPerfBenchmark');
                    window.history.replaceState(window.history.state, '', restored.href);
                    addManualPerfButton();
                }
            };
        })();
    </script>
</body>
</html>
