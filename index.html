<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Adventure v2</title>
    <link rel="stylesheet" href="./src/presentation/styles/game.css" />
    <link rel="stylesheet" href="./src/presentation/styles/models.css">
  </head>
  <body>
    <div id="frame" inert>
      <main id="game" class="game-shell" aria-label="Adventure">
        <aside class="status-panel" aria-label="게임 상태와 주사위">
          <section class="profile-panel">
            <button
              class="position-button"
              id="position-button"
              aria-label="현재 칸 변경"
            >
              <output id="position">1</output> <span>칸</span>
            </button>
            <div class="portrait" role="img" aria-label="캐릭터"></div>
            <div id="stage-name" class="stage-name"></div>
            <output id="stage-position" class="stage-position">1</output>
          </section>
          <section class="estimate-panel">
            <div class="estimate-heading">
            <button id="settings-button" class="panel-heading">
              예상 점수
            </button>
            <button id="compare-button" aria-label="행동 전체 비교" title="행동 전체 비교" disabled>비교</button>
            </div>
            <div
              id="estimates"
              class="estimate-list"
              aria-label="예상 점수 목록"
            ></div>
          </section>
          <section class="dice-panel">
            <div class="dice-heading">주사위 이동</div>
            <div id="dice-buttons" class="dice-buttons"></div>
          </section>
          <button
            id="roll-button"
            class="roll-button"
            aria-label="더블 여부 변경"
          ></button>
          <div class="dice-remaining">
            주사위 보유 : <output id="remaining"></output>
          </div>
          <button id="dice-used-button" class="dice-used">
            주사위 사용 횟수 <output id="dice-used">0</output> / 100
          </button>
        </aside>
        <section class="board-viewport" aria-label="보드">
          <canvas
            id="board-canvas"
            width="1024"
            height="694"
            aria-hidden="true"
          ></canvas>
          <button
            id="character-target"
            class="character-target"
            aria-label="캐릭터 위치 편집"
          ></button>
          <p id="board-description" class="sr-only" aria-live="polite"></p>
          <nav class="toolbar" aria-label="게임 도구">
            <div class="record">
              최고 기록: <output id="high-score">1 칸</output>
            </div>
            <div id="hand" class="hand" aria-label="행운 카드"></div>
            <button
              id="card-info-button"
              class="card-info-button"
              aria-label="카드 정보"
              aria-expanded="false"
            >
              ?
            </button>
            <button id="reset-button" class="blue-button">재시작</button>
            <button id="mode-button" class="blue-button">모드변경</button>
            <button id="help-button" class="blue-button">도움말</button>
            <div class="stage-navigation">
              <button id="prev-stage" aria-label="이전 스테이지"></button
              ><button id="next-stage" aria-label="다음 스테이지"></button>
            </div>
          </nav>
          <section
            id="card-info"
            class="card-info"
            aria-label="카드 획득 정보"
            hidden
          >
            <div id="card-info-list" class="card-info-list"></div>
          </section>
        </section>
      </main>
    </div>
    <section
      id="score-overview"
      class="popover overview"
      aria-label="예상 점수 전체 비교"
      hidden
    >
      <header><strong>예상 점수 전체 비교</strong><span>6개 case</span></header>
      <p class="legend">
        <b class="recommended">추천</b>: 현재 평균이 가장 높은 선택 ·
        <b class="near">근접</b>: 차이가 작아 우열이 애매한 선택 ·
        <b class="candidate">후보</b>: 아직 제외되지 않은 선택
      </p>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>case</th>
              <th id="center-label">평균</th>
              <th>범위</th>
              <th>95% CI</th>
              <th>샘플</th>
              <th>추천차</th>
              <th>상태</th>
            </tr>
          </thead>
          <tbody id="overview-body"></tbody>
        </table>
      </div>
      <div id="evaluation-detail" class="evaluation-detail"></div>
    </section>
    <section
      id="prediction"
      class="popover prediction"
      aria-label="도착 예측"
      hidden
    >
      <div id="prediction-content"></div>
    </section>
    <div id="loading" class="loading">
      <section class="loading-card" aria-label="게임 준비">
        <p class="loading-brand">Adventure</p>
        <header>
          <strong>모험을 준비하고 있어요</strong
          ><output id="loading-percent">0%</output>
        </header>
        <p id="loading-status">잠시 후 게임이 시작됩니다.</p>
        <progress id="loading-progress" max="100" value="0"></progress>
        <p id="loading-detail">화면 준비 중</p>
        <div class="loading-links"><button id="boot-retry" hidden>다시 시도</button><button id="boot-diagnostics" title="현재 오류와 브라우저 정보를 파일로 저장합니다. 자동 전송되지 않습니다." hidden>진단 정보 저장</button><a id="legacy-link" class="legacy-access" href="./old/v1/" aria-label="기존 화면으로 이동"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2"/><path d="M3 7h14"/></svg><span>기존 화면</span><span class="legacy-arrow" aria-hidden="true">→</span></a></div>
      </section>
    </div>
    <div id="notification-stack" class="notification-stack" hidden>
      <div id="toast" class="notification toast" role="status" aria-atomic="true" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/></svg><span class="notification-message"></span></div>
      <div id="asset-notice" class="notification asset-notice" role="status" aria-atomic="true" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 10 18H2L12 3Z"/><path d="M12 9v5M12 17v1"/></svg><span class="notification-message"></span><button type="button">다시 시도</button></div>
      <div id="debug-notice" class="notification" role="status" aria-atomic="true" hidden><span class="notification-message">문제가 반복되면 진단 정보를 함께 전달해 주세요.</span><button type="button">진단 정보</button></div>
    </div>
    <script src="./src/platform/diagnostics.js"></script>
    <script src="./src/bootstrap/loader.js"></script>
  </body>
</html>
