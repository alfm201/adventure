    function mean(values) {
      return values.reduce((sum, value) => sum + value, 0) / Math.max(1, values.length);

    function stdev(values) {
      if (values.length <= 1) return 0;
      const avg = mean(values);
      return Math.sqrt(values.reduce((sum, value) => sum + (value - avg) ** 2, 0) / (values.length - 1));
    }

    function percentile(values, p) {
      const sorted = [...values].sort((a, b) => a - b);
      const rank = (p / 100) * (sorted.length - 1);
      const lo = Math.floor(rank);
      const hi = Math.ceil(rank);
      const t = rank - lo;
      return sorted[lo] * (1 - t) + sorted[hi] * t;
    }

    function createActionStats() {

    function mergeGpuSummary(acc, summary) {
      if (!summary || summary.count <= 0) return;
      const variance = summary.std * summary.std;
      acc.count += summary.count;
      acc.sum += summary.mean * summary.count;
      acc.sumSq += (variance + summary.mean * summary.mean) * summary.count;
      acc.min = Math.min(acc.min, summary.min);
      acc.max = Math.max(acc.max, summary.max);
    }

    function getActionSummary(acc) {
      if (acc.count === 0) return { count: 0, avg: 0, min: 0, max: 0, std: 0, se: Infinity };
      const avg = acc.sum / acc.count;
      const variance = Math.max(0, acc.sumSq / acc.count - avg * avg);
      const std = Math.sqrt(variance);
      return { count: acc.count, avg, min: acc.min, max: acc.max, std, se: Math.sqrt(variance / acc.count) };
    }

    function getAdaptiveDecision(actionStats, activeActions) {
      const summaries = actionStats.map(getActionSummary);
      const candidates = activeActions
        .filter(action => actionStats[action].count > 0)
        .map(action => ({ action, ...summaries[action] }))
        .sort((a, b) => b.avg - a.avg);
      if (candidates.length <= 1) {
        return { stop: true, summaries, bestAction: candidates.length > 0 ? candidates[0].action : 0, gap: Infinity, z: Infinity };
      }
      const best = candidates[0];
      const second = candidates[1];
      const gap = best.avg - second.avg;
      const combinedSe = Math.sqrt(best.se * best.se + second.se * second.se);
      const bestLcb = best.avg - BOUND_Z * best.se;
      const maxOtherUcb = Math.max(...candidates.slice(1).map(candidate => candidate.avg + BOUND_Z * candidate.se));
      return { stop: bestLcb > maxOtherUcb, summaries, bestAction: best.action, gap, z: combinedSe > 0 ? gap / combinedSe : Infinity };
    }

    function pruneAdaptiveActions(actionStats, activeActions) {
      if (activeActions.length <= 2) return activeActions;
      const summaries = actionStats.map(getActionSummary);
      const candidates = activeActions
        .filter(action => actionStats[action].count > 0)
        .map(action => ({ action, ...summaries[action] }))
        .sort((a, b) => b.avg - a.avg);
      if (candidates.length <= 2) return activeActions;
      const best = candidates[0];
      const bestLcb = best.avg - BOUND_Z * best.se;
      const keep = new Set([best.action]);
      candidates.slice(1).forEach(candidate => {
        if (candidate.avg + BOUND_Z * candidate.se >= bestLcb) keep.add(candidate.action);
      });
      return activeActions.filter(action => keep.has(action));
    }

    function getAdaptiveSampleActions(actionStats, activeActions, maxIteration) {
      const summaries = actionStats.map(getActionSummary);
      const candidates = activeActions
        .filter(action => actionStats[action].count > 0 && actionStats[action].count < maxIteration)
        .map(action => ({ action, ...summaries[action] }))
        .sort((a, b) => b.avg - a.avg);
      if (candidates.length <= 1) return candidates.map(candidate => candidate.action);
      const best = candidates[0];
      const bestLcb = best.avg - BOUND_Z * best.se;
      const sample = candidates
        .filter(candidate => candidate.action === best.action || candidate.avg + BOUND_Z * candidate.se >= bestLcb)
        .map(candidate => candidate.action)
        .sort((a, b) => actionStats[a].count - actionStats[b].count)
        .slice(0, SAMPLE_LIMIT);
      if (actionStats[best.action].count < maxIteration && !sample.includes(best.action)) sample.push(best.action);
      return sample;
    }

    function getDynamicCandidateActions(candidateInfo, actionCount, policy) {
      const ranked = candidateInfo?.ranked || [];

      const top1 = ranked[0];
      const top2 = ranked[1];
      const top3 = ranked[2];
      const top4 = ranked[3];
      const top3Cum = ranked.slice(0, 3).reduce((sum, row) => sum + (row.prob || 0), 0);
      const top1Gap = (top1.logit || 0) - (top2.logit || 0);
      const top3Top4Gap = top4 ? (top3.logit || 0) - (top4.logit || 0) : Infinity;
      if ((top1.prob || 0) >= policy.dynamicTop1Prob && top1Gap >= policy.dynamicTop3Top4Gap) {
        return ranked.slice(0, Math.min(2, actionCount)).map(row => row.action);
      }
      if (top3Cum >= policy.dynamicTop3CumProb && top3Top4Gap >= policy.dynamicTop3Top4Gap) {
        return ranked.slice(0, Math.min(3, actionCount)).map(row => row.action);
      }
      if (top4 && top3Top4Gap < policy.dynamicTop3Top4Gap) {
        return ranked.slice(0, Math.min(4, actionCount)).map(row => row.action);
      }
      return ranked.slice(0, Math.min(3, actionCount)).map(row => row.action);

            action,
            rolloutCount: initialIteration,
            seed: gpuSeed(policy, scenarioId, replicateId, decisionIndex, state, `method=runGpu|action=${action}|phase=initial`),
            policy: policy.rolloutPolicy,
          });
          mergeGpuSummary(actionStats[action], { action, count: initialIteration, ...summary });
        }
      }

      while (true) {
        let decision = getAdaptiveDecision(actionStats, activeActions);
        if (activeActions.every(action => actionStats[action].count >= maxIteration) || decision.stop) {
          return {
            action: decision.bestAction,
            bestAction: decision.bestAction,
            totalIterations: actionStats.reduce((sum, stat) => sum + stat.count, 0),
            maxActionIterations: Math.max(...actionStats.map(stat => stat.count)),
            elapsedMs: performance.now() - startedAt,
            candidateActions: activeActions.slice(),
            candidateRanked: candidateInfo?.ranked || null,
            actionSummaries: compactActionSummaries(actionStats),
          };
        }

        activeActions = pruneAdaptiveActions(actionStats, activeActions);
        decision = getAdaptiveDecision(actionStats, activeActions);
        if (activeActions.length <= 1) {
          return {
            action: decision.bestAction,
            bestAction: decision.bestAction,
            totalIterations: actionStats.reduce((sum, stat) => sum + stat.count, 0),
            maxActionIterations: Math.max(...actionStats.map(stat => stat.count)),
            elapsedMs: performance.now() - startedAt,
            candidateActions: activeActions.slice(),
            candidateRanked: candidateInfo?.ranked || null,
            actionSummaries: compactActionSummaries(actionStats),
          };
        }

        const sampleActions = getAdaptiveSampleActions(actionStats, activeActions, maxIteration);
        if (sampleActions.length === 0) {
          return {
            action: decision.bestAction,
            bestAction: decision.bestAction,
            totalIterations: actionStats.reduce((sum, stat) => sum + stat.count, 0),
            maxActionIterations: Math.max(...actionStats.map(stat => stat.count)),
            elapsedMs: performance.now() - startedAt,
            candidateActions: activeActions.slice(),
            candidateRanked: candidateInfo?.ranked || null,
            actionSummaries: compactActionSummaries(actionStats),
          };
        }

        for (const action of sampleActions) {
          const rolloutCount = Math.min(batchIteration, maxIteration - actionStats[action].count);
          if (rolloutCount <= 0) continue;
          const summary = await window.gpuRolloutWorkbench.runGpu({
            tables,
            sample,
            action,
            rolloutCount,
            seed: gpuSeed(policy, scenarioId, replicateId, decisionIndex, state, `method=runGpu|action=${action}|count=${actionStats[action].count}`),
            policy: policy.rolloutPolicy,
          });
          mergeGpuSummary(actionStats[action], { action, count: rolloutCount, ...summary });
        }
      }
    }

    async function runEpisode(tables, policy, scenarioId, replicateId) {
      const env = new Board();
      env.autoProcess = true;
      env.setRandomContext({ seed: SEED_BASE, scenarioId, replicateId, decisionIndex: 0 });
      let done = false;
      let decisions = 0;
      let usedActionIterations = 0;
      let maxActionIterations = 0;
      let gpuDecisionMs = 0;
      let candidateActionSelections = 0;
      let teacherDecisions = 0;
      let teacherFallbacks = 0;
      let teacherMarginSum = 0;
      let teacherCombinedSeSum = 0;
      let qOverrideDecisions = 0;
      let qOverrideUsed = 0;
      let qOverrideGapSum = 0;
      let contextRiskDecisions = 0;
      let contextRiskUsed = 0;
      let contextRiskBetterSum = 0;
      let contextRiskRiskSum = 0;
      const startedAt = performance.now();
      const trace = TRACE_DECISIONS ? [] : null;
      const overrideTrace = TRACE_OVERRIDES ? [] : null;

      while (!done) {
        const state = env.getState();
        const actionCount = env.cards.length + 1;
        const decision = await chooseActionGpu(tables, state, actionCount, policy, scenarioId, replicateId, decisions);
        const traceRow = trace ? {
          decision: decisions,
          state: state.slice(),
          actionCount,
          action: decision.action,
          selectedAction: decision.action,
          bestAction: Number.isFinite(decision.bestAction) ? decision.bestAction : decision.action,
          actionInfo: actionTraceInfo(state, decision.action),
          scoreBefore: Number(state[2] || 0),
          stageIdBefore: Number(state[3] || 0),
          spaceIdBefore: Number(state[4] || 0),
          diceUseBefore: Number(state[5] || 0),
          isDoubleBefore: Number(state[6] || 0) === 1,
          handBefore: state.slice(7, 12).filter(Boolean).map(cardTraceInfo),
          ranked: compactRankedRows(decision.candidateRanked),
          candidateActions: Array.isArray(decision.candidateActions) ? decision.candidateActions.slice() : null,
          actionSummaries: compactRankedRows(decision.actionSummaries),
          totalIterations: decision.totalIterations,
          maxActionIterations: decision.maxActionIterations,
          qOverrideGap: Number.isFinite(decision.qOverrideGap) ? decision.qOverrideGap : null,
          qOverrideUsed: decision.qOverrideUsed === true,
          qOverrideFallbackAction: Number.isFinite(decision.qOverrideFallbackAction) ? decision.qOverrideFallbackAction : null,
          qOverrideTopAction: Number.isFinite(decision.qOverrideTopAction) ? decision.qOverrideTopAction : null,
          qOverrideTopQ: Number.isFinite(decision.qOverrideTopQ) ? decision.qOverrideTopQ : null,
          qOverrideFallbackQ: Number.isFinite(decision.qOverrideFallbackQ) ? decision.qOverrideFallbackQ : null,
          contextRiskUsed: decision.contextRiskUsed === true,
          contextRiskOldAction: Number.isFinite(decision.contextRiskOldAction) ? decision.contextRiskOldAction : null,
          contextRiskCandidateAction: Number.isFinite(decision.contextRiskCandidateAction) ? decision.contextRiskCandidateAction : null,
          contextRiskBetter: Number.isFinite(decision.contextRiskBetter) ? decision.contextRiskBetter : null,
          contextRiskRisk: Number.isFinite(decision.contextRiskRisk) ? decision.contextRiskRisk : null,
          contextRiskDelta: Number.isFinite(decision.contextRiskDelta) ? decision.contextRiskDelta : null,
          elapsedMs: decision.elapsedMs,
        } : null;
        usedActionIterations += decision.totalIterations;
        maxActionIterations = Math.max(maxActionIterations, decision.maxActionIterations);
        gpuDecisionMs += decision.elapsedMs;
        candidateActionSelections += Array.isArray(decision.candidateActions) ? decision.candidateActions.length : actionCount;
        if (Number.isFinite(decision.teacherMargin)) {
          teacherDecisions += 1;
          teacherMarginSum += decision.teacherMargin;
          teacherCombinedSeSum += Number.isFinite(decision.teacherCombinedSe) ? decision.teacherCombinedSe : 0;
          if (decision.safeUsedTeacher === false) teacherFallbacks += 1;
        }
        if (Number.isFinite(decision.qOverrideGap)) {
          qOverrideDecisions += 1;
          qOverrideGapSum += decision.qOverrideGap;
          if (decision.qOverrideUsed) qOverrideUsed += 1;
        }
        if (Number.isFinite(decision.contextRiskBetter)) {
          contextRiskDecisions += 1;
          contextRiskBetterSum += decision.contextRiskBetter;
          contextRiskRiskSum += Number.isFinite(decision.contextRiskRisk) ? decision.contextRiskRisk : 0;
          if (decision.contextRiskUsed) contextRiskUsed += 1;
        }
        env.setRandomContext({ seed: SEED_BASE, scenarioId, replicateId, decisionIndex: decisions, action: decision.action });
        done = env.step(decision.action);
        if (traceRow) {
          traceRow.scoreAfter = env.score;
          traceRow.diceUseAfter = env.diceUse;
          traceRow.isDoubleAfter = env.isDouble;
          traceRow.done = done;
          trace.push(traceRow);
        }
        if (overrideTrace && decision.qOverrideUsed === true) {
          overrideTrace.push({
            decision: decisions,
            state: state.slice(),
            actionCount,
            action: decision.action,
            baselineAction: decision.qOverrideFallbackAction,
            topAction: decision.qOverrideTopAction,
            actionInfo: actionTraceInfo(state, decision.action),
            baselineActionInfo: actionTraceInfo(state, decision.qOverrideFallbackAction),
            scoreBefore: Number(state[2] || 0),
            stageIdBefore: Number(state[3] || 0),
            spaceIdBefore: Number(state[4] || 0),
            diceUseBefore: Number(state[5] || 0),
            isDoubleBefore: Number(state[6] || 0) === 1,
            handBefore: state.slice(7, 12).filter(Boolean).map(cardTraceInfo),
            ranked: compactRankedRows(decision.candidateRanked),
            qOverrideGap: Number.isFinite(decision.qOverrideGap) ? decision.qOverrideGap : null,
            qOverrideTopQ: Number.isFinite(decision.qOverrideTopQ) ? decision.qOverrideTopQ : null,
            qOverrideFallbackQ: Number.isFinite(decision.qOverrideFallbackQ) ? decision.qOverrideFallbackQ : null,
            scoreAfter: env.score,
            diceUseAfter: env.diceUse,
            isDoubleAfter: env.isDouble,
            done,
          });
        }
        decisions += 1;
      }

      const episode = {
        scenario_id: scenarioId,
        replicate_id: replicateId,
        policy: policy.policy,
        policyId: policy.id,
        index: scenarioId,
        seed: SEED_BASE,
        score: env.score,
        finalScore: env.score,
        decisions,
        usedActionIterations,
        maxActionIterations,
        gpuDecisionMs,
        candidateActionSelections,
        meanCandidateActions: candidateActionSelections / Math.max(1, decisions),
        teacherDecisions,
        teacherFallbacks,
        teacherFallbackRate: teacherFallbacks / Math.max(1, teacherDecisions),
        meanTeacherMargin: teacherMarginSum / Math.max(1, teacherDecisions),
        meanTeacherCombinedSe: teacherCombinedSeSum / Math.max(1, teacherDecisions),
        qOverrideDecisions,
        qOverrideUsed,
        qOverrideRate: qOverrideUsed / Math.max(1, qOverrideDecisions),
        meanQOverrideGap: qOverrideGapSum / Math.max(1, qOverrideDecisions),
        contextRiskDecisions,
        contextRiskUsed,
        contextRiskRate: contextRiskUsed / Math.max(1, contextRiskDecisions),
        meanContextRiskBetter: contextRiskBetterSum / Math.max(1, contextRiskDecisions),
        meanContextRiskRisk: contextRiskRiskSum / Math.max(1, contextRiskDecisions),
        elapsedMs: performance.now() - startedAt,
      };
      if (TRACE_CHUNKED && (trace || overrideTrace)) {
        await postTraceChunk({
          kind: 'episodeTrace',
          policy: policy.policy,
          policyId: policy.id,
          scenario_id: scenarioId,
          replicate_id: REPLICATE_ID,
          seed: SEED_BASE,
          score: episode.score,
          decisions,
          trace: trace || undefined,
          overrideTrace: overrideTrace || undefined,
        });
        if (trace) episode.traceRows = trace.length;
        if (overrideTrace) episode.overrideTraceRows = overrideTrace.length;
      } else {
        if (trace) episode.trace = trace;
        if (overrideTrace) episode.overrideTrace = overrideTrace;
      }
      return episode;
    }

    function summarizePolicy(policy, episodes, elapsedMs) {
      const scores = episodes.map(episode => episode.score);
      const totalDecisions = episodes.reduce((sum, episode) => sum + episode.decisions, 0);
      const gpuDecisionMs = episodes.reduce((sum, episode) => sum + episode.gpuDecisionMs, 0);
      const totalUsedActionIterations = episodes.reduce((sum, episode) => sum + episode.usedActionIterations, 0);
      const totalCandidateActionSelections = episodes.reduce((sum, episode) => sum + (episode.candidateActionSelections || 0), 0);
      const teacherDecisions = episodes.reduce((sum, episode) => sum + (episode.teacherDecisions || 0), 0);
      const teacherFallbacks = episodes.reduce((sum, episode) => sum + (episode.teacherFallbacks || 0), 0);
      const teacherMarginWeightedSum = episodes.reduce((sum, episode) => sum + (episode.meanTeacherMargin || 0) * (episode.teacherDecisions || 0), 0);
      const teacherCombinedSeWeightedSum = episodes.reduce((sum, episode) => sum + (episode.meanTeacherCombinedSe || 0) * (episode.teacherDecisions || 0), 0);
      const qOverrideDecisions = episodes.reduce((sum, episode) => sum + (episode.qOverrideDecisions || 0), 0);
      const qOverrideUsed = episodes.reduce((sum, episode) => sum + (episode.qOverrideUsed || 0), 0);
      const qOverrideGapWeightedSum = episodes.reduce((sum, episode) => sum + (episode.meanQOverrideGap || 0) * (episode.qOverrideDecisions || 0), 0);
      const contextRiskDecisions = episodes.reduce((sum, episode) => sum + (episode.contextRiskDecisions || 0), 0);
      const contextRiskUsed = episodes.reduce((sum, episode) => sum + (episode.contextRiskUsed || 0), 0);
      const contextRiskBetterWeightedSum = episodes.reduce((sum, episode) => sum + (episode.meanContextRiskBetter || 0) * (episode.contextRiskDecisions || 0), 0);
      const contextRiskRiskWeightedSum = episodes.reduce((sum, episode) => sum + (episode.meanContextRiskRisk || 0) * (episode.contextRiskDecisions || 0), 0);
      return {
        policy: policy.policy,
        policyId: policy.id,
        label: policy.label,
        modelVersion: policy.modelVersion || '운영',
        computeEngine: policy.computeEngine,
        source: policy.source,
        leaderboardEligible: policy.leaderboardEligible ?? true,
        x36StageCost: Math.max(0, Math.round(Number(policy.x36StageCost ?? 2) || 0)),
        episodes,
        scores,
        iteration: policy.iteration,
        batchPct: policy.batchPct,
        maxPct: policy.maxPct,
        actual: {
          initialIteration: Math.max(1, Math.floor(policy.iteration * 0.1)),
          batchIteration: Math.max(1, Math.floor(policy.iteration * policy.batchPct / 100)),
          maxIteration: Math.max(1, Math.floor(policy.iteration * policy.maxPct / 100)),
        },
        gpuPolicy: {
          mode: policy.decisionMode === 'fixedAllActions' ? 'fixed_all_actions' : 'adaptive_prune',
          initialPct: policy.decisionMode === 'fixedAllActions' ? null : 10,
          batchPct: policy.batchPct,
          maxPct: policy.maxPct,
          boundZ: BOUND_Z,
          sampleLimit: SAMPLE_LIMIT,
          rolloutPolicy: policy.rolloutPolicy,
          x36StageCost: Math.max(0, Math.round(Number(policy.x36StageCost ?? 2) || 0)),
          batchDispatch: policy.batchDispatch,
          decisionMode: policy.decisionMode || null,
          candidatePolicy: policy.candidatePolicy || null,
          candidateTopK: policy.candidateTopK || null,
          dynamicTop1Prob: policy.dynamicTop1Prob || null,
          dynamicTop3CumProb: policy.dynamicTop3CumProb || null,
          dynamicTop3Top4Gap: policy.dynamicTop3Top4Gap || null,
        },
        randomMode: false,
        rngMode: 'keyed',
        seedBase: SEED_BASE,
        elapsedMs,
        elapsedSec: elapsedMs / 1000,
        gpuDecisionMs,
        meanScore: mean(scores),
        stdScore: stdev(scores),
        standardError: stdev(scores) / Math.sqrt(scores.length),
        minScore: Math.min(...scores),
        p25Score: percentile(scores, 25),
        p50Score: percentile(scores, 50),
        p75Score: percentile(scores, 75),
        maxScore: Math.max(...scores),
        totalDecisions,
        meanDecisions: totalDecisions / Math.max(1, episodes.length),
        meanDecisionMs: elapsedMs / Math.max(1, totalDecisions),
        meanGpuDecisionMs: gpuDecisionMs / Math.max(1, totalDecisions),
        totalUsedActionIterations,
        meanUsedActionIterations: totalUsedActionIterations / Math.max(1, totalDecisions),
        totalCandidateActionSelections,
        meanCandidateActions: totalCandidateActionSelections / Math.max(1, totalDecisions),
        teacherDiagnostics: {
          decisions: teacherDecisions,
          fallbackCount: teacherFallbacks,
          fallbackRate: teacherFallbacks / Math.max(1, teacherDecisions),
          meanMargin: teacherMarginWeightedSum / Math.max(1, teacherDecisions),
          meanCombinedSe: teacherCombinedSeWeightedSum / Math.max(1, teacherDecisions),
        },
        qOverrideDiagnostics: {
          decisions: qOverrideDecisions,
          overrideCount: qOverrideUsed,
          overrideRate: qOverrideUsed / Math.max(1, qOverrideDecisions),
          meanGap: qOverrideGapWeightedSum / Math.max(1, qOverrideDecisions),
        },
        contextRiskDiagnostics: {
          decisions: contextRiskDecisions,
          flipCount: contextRiskUsed,
          flipRate: contextRiskUsed / Math.max(1, contextRiskDecisions),
          meanBetter: contextRiskBetterWeightedSum / Math.max(1, contextRiskDecisions),
          meanRisk: contextRiskRiskWeightedSum / Math.max(1, contextRiskDecisions),
        },
      };
    }

    async function main() {
      const tables = buildGpuTables();
      configureGpuConstants(POLICIES[0]);
      await runGpuAll(
        tables,
        { state: new Board().getState(), actionCount: 1 },
        64,
        AdventureKeyedRng.randomUint32(SEED_BASE, 'Gpu.rolloutSeed', 'warmup'),
        POLICIES[0],
      );

      const policyResults = [];
      const benchmarkStartedAt = performance.now();
      for (const policy of POLICIES) {
        configureGpuConstants(policy);
        log(`policy: ${policy.policy}`);
        const startedAt = performance.now();
        const episodes = [];
        for (let scenarioId = 0; scenarioId < EPISODES; scenarioId += 1) {
          episodes.push(await runEpisode(tables, policy, scenarioId, REPLICATE_ID));
          const elapsedMs = performance.now() - startedAt;
          const done = scenarioId + 1;
          const meanMs = elapsedMs / done;
          const etaMs = (EPISODES - done) * meanMs;
          reportProgress(done, EPISODES, elapsedMs, etaMs);
        }
        policyResults.push(summarizePolicy(policy, episodes, performance.now() - startedAt));
      }

      window.__fullGameBenchmarkResult = {
        benchmark: 'keyed_full_game',
        generatedAt: new Date().toISOString(),
        source: 'benchmarks/scripts/run_full_game_gpu_browser.js',
        episodes: EPISODES,
        seedBase: SEED_BASE,
        replicate_id: REPLICATE_ID,
        policySet: POLICY_SET,
        traceDecisions: TRACE_DECISIONS,
        traceOverrides: TRACE_OVERRIDES,
        traceChunked: TRACE_CHUNKED,
        rolloutCountOverride: Number.isFinite(ROLLOUT_COUNT_OVERRIDE) && ROLLOUT_COUNT_OVERRIDE > 0 ? Math.floor(ROLLOUT_COUNT_OVERRIDE) : null,
        maxStepsOverride: Number.isFinite(MAX_STEPS_OVERRIDE) && MAX_STEPS_OVERRIDE > 0 ? Math.floor(MAX_STEPS_OVERRIDE) : null,
        rng: {
          mode: 'keyed',
          function: 'random01(seed, streamName, eventKey)',
          streams: ['Board.getRandom.val1', 'Board.getRandom.val2', 'Board.getCard.index', 'Gpu.rolloutSeed'],
        },
        policies: POLICIES,
        policyResults,
        elapsedMs: performance.now() - benchmarkStartedAt,
      };
      log('done');
    }

    main().catch(error => {
      window.__fullGameBenchmarkError = String(error && error.stack || error);
      log(window.__fullGameBenchmarkError);
    });
  </script>
