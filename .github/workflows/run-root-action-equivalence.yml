name: run-root-action-equivalence

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  run-payload:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'root-action-equivalence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: root-action-equivalence
          fetch-depth: 0
      - name: Apply source patch
        shell: bash
        run: |
          if grep -q 'function buildRolloutActionEquivalence' js/adventure.js; then
            echo 'source already patched'
            exit 0
          fi
          python .github/root_action_patch.py
          node --check js/adventure.js
          node --check js/gpu_engine.js
          python - <<'PY'
          from pathlib import Path
          a = Path('js/adventure.js').read_text(encoding='utf-8')
          g = Path('js/gpu_engine.js').read_text(encoding='utf-8')
          assert 'buildRolloutActionEquivalence' in a
          assert 'env.exRecommendedActions?.includes(action)' in a
          assert 'runGpuActions' in a
          assert 'actionIndex = u32(inputState[42u + workgroupId.y])' in g
          assert 'runGpuActions,' in g
          print('static checks passed')
          PY
      - name: Commit patched sources
        shell: bash
        run: |
          if git diff --quiet -- js/adventure.js js/gpu_engine.js index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/adventure.js js/gpu_engine.js index.html
          git commit -m "동일 카드 root rollout 통합"
          git push origin HEAD:root-action-equivalence
