name: FQ1 direct source cleanup

on:
  push:
    paths:
      - '.github/workflows/fq1-direct-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply direct source changes
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          engine = Path('js/fq1_webgpu.js')
          source = engine.read_text(encoding='utf-8')
          old = """      this.laneCapacity = clampInt(
        this.options.laneCapacity ?? new URLSearchParams(location.search).get('fq1Batch') ?? DEFAULT_LANES,
        16,
        256,
      );"""
          new = """      this.laneCapacity = clampInt(
        this.options.laneCapacity ?? new URLSearchParams(location.search).get('fq1Batch') ?? DEFAULT_LANES,
        16,
        8192,
      );"""
          if source.count(old) != 1:
              raise SystemExit('Expected lane clamp block was not found exactly once.')
          engine.write_text(source.replace(old, new), encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          patch_line = '    <script src="./js/fq1_lane_limit_patch.js?v=20260806080300000000"></script>\n'
          if patch_line not in html:
              raise SystemExit('Expected lane patch script tag was not found.')
          html = html.replace(patch_line, '')
          html = html.replace(
              './js/fq1_mode.js?v=20260806080300000000',
              './js/fq1_mode.js?v=20260806081000000000',
          )
          index.write_text(html, encoding='utf-8')
          PY

          rm -f js/fq1_lane_limit_patch.js
          rm -f .github/workflows/fq1-direct-cleanup.yml

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/fq1_webgpu.js js/fq1_lane_limit_patch.js index.html .github/workflows/fq1-direct-cleanup.yml
          git commit -m "Apply FQ1 lane limit directly and remove patch loader"
          git push
